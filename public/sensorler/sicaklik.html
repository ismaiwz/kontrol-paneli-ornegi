<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sıcaklık Sensörü Simülasyonu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: black;
            margin: 0;
            overflow: hidden;
        }
        .box {
            width: 100px;
            height: 100px;
            position: relative;
            top: 50%;
            transform: translateY(-50%);
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: box-shadow 0.25s ease;
        }
        .h-100 {
            height: 100vh !important;
        }
        .cursor-pointer {
            cursor: pointer;
        }
        .heat-aura {
            position: absolute;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 87, 34, 0.35) 0%, rgba(255, 193, 7, 0.08) 50%, transparent 70%);
            pointer-events: none;
            animation: heatPulse 2.4s ease-in-out infinite;
        }
        @keyframes heatPulse {
            0%, 100% {
                transform: scale(0.95);
                opacity: 0.85;
            }
            50% {
                transform: scale(1.06);
                opacity: 1;
            }
        }
        .telemetry-panel {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(33, 37, 41, 0.9);
            border: 1px solid #495057;
            color: #ffc107;
            padding: 12px 16px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            z-index: 2000;
            min-width: 240px;
        }
    </style>
</head>
<body>

<div class="telemetry-panel">
    <div>SOCKET: <span id="ws-status" class="text-danger">BAGLI DEGIL</span></div>
    <div>GECIKME: <span id="delay-val" class="text-light">100</span> ms</div>
    <div>SICAKLIK: <span id="temp-val">22.0</span> °C</div>
</div>

<div class="container-fluid w-100 p-0 h-100">
    <div class="row p-0 m-0 h-100">
        <div class="col-2 ms-0 ps-0">
            <div class="box bg-warning text-dark fw-bold" id="sensor">
                <span>sicaklik sensoru</span>
            </div>
        </div>
        <div class="col-10">
            <div class="box bg-danger draggable cursor-pointer text-white fw-bold">
                <div class="heat-aura"></div>
                <span>isi kaynagi</span>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.socket.io/4.8.4/socket.io.min.js"></script>
<script>
    const draggable = document.querySelector('.draggable');
    const sensor = document.getElementById('sensor');
    const wsStatusEl = document.getElementById('ws-status');
    const delayValEl = document.getElementById('delay-val');
    const tempValEl = document.getElementById('temp-val');

    const socket = io();
    let gecikmeMs = 100; // default gecikme süresi
    let ustLimit = 100; // default ust limit
    let timer = null;

    async function ayarlariGetir() {
        try {
            const res = await fetch('/getSettingsData', { method: 'POST' });
            const data = await res.json();
            if (data && data.sicaklik) {
                if (data.sicaklik.max > 0) ustLimit = Math.max(100, Number(data.sicaklik.max) * 1.2);
                const yeniMs = Number(data.sicaklik.ms);
                if (yeniMs > 0 && yeniMs !== gecikmeMs) {
                    gecikmeMs = yeniMs;
                    delayValEl.textContent = gecikmeMs;
                    clearInterval(timer);
                    timer = setInterval(sicaklikOlc, gecikmeMs);
                }
            }
        } catch (e) {}
    }

    socket.on('connect', () => {
        wsStatusEl.textContent = 'BAGLANDI';
        wsStatusEl.className = 'text-success';
    });

    socket.on('disconnect', () => {
        wsStatusEl.textContent = 'KOPTU';
        wsStatusEl.className = 'text-danger';
    });
    /* drag fonskiyonları */
    let isDragging = false;
    let offsetX = 0;
    let offsetY = 0;

    draggable.addEventListener('pointerdown', (e) => {
        isDragging = true;
        const rect = draggable.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;

        draggable.style.position = 'absolute';
        draggable.style.left = rect.left + 'px';
        draggable.style.top = rect.top + 'px';
        draggable.style.transform = 'none';
        draggable.style.zIndex = '1000';
        draggable.setPointerCapture(e.pointerId);
    });

    document.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const rect = draggable.getBoundingClientRect();
        const maxLeft = window.innerWidth - rect.width;
        const maxTop = window.innerHeight - rect.height;
        draggable.style.left = Math.min(Math.max(0, e.clientX - offsetX), maxLeft) + 'px';
        draggable.style.top = Math.min(Math.max(0, e.clientY - offsetY), maxTop) + 'px';
    });

    document.addEventListener('pointerup', () => isDragging = false);
    document.addEventListener('pointercancel', () => isDragging = false);

    const ortamSicakligi = -5.0; // ayarlanabilir ortam sıcaklığı
    let mevcutSicaklik = ortamSicakligi;
    let sonZaman = performance.now();

    function sicaklikOlc() {
        // sıcaklığı basit bi şekilde ölçmek için ısı kaynağı ile sensör arasındaki mesafeyi alıp ona göre bir hesap yapıyoruz
        const simdi = performance.now();
        const dt = Math.min(1.0, Math.max(0.001, (simdi - sonZaman) / 1000));
        sonZaman = simdi;

        const sRect = sensor.getBoundingClientRect();
        const hRect = draggable.getBoundingClientRect();

        const dx = (hRect.left + hRect.width / 2) - (sRect.left + sRect.width / 2);
        const dy = (hRect.top + hRect.height / 2) - (sRect.top + sRect.height / 2);
        const mesafe = Math.hypot(dx, dy);

        const temasMesafesi = 50;
        const efektifMesafe = Math.max(0, mesafe - temasMesafesi);
        const etki = 1 / (1 + Math.pow(efektifMesafe / 140, 2));
        const hedefSicaklik = ortamSicakligi + (etki * (ustLimit - ortamSicakligi));

        const tau = hedefSicaklik > mevcutSicaklik ? 0.9 : 1.8;
        const alpha = 1 - Math.exp(-dt / tau);
        mevcutSicaklik += (hedefSicaklik - mevcutSicaklik) * alpha;

        const netSicaklik = Number((mevcutSicaklik + (Math.random() - 0.5) * 0.2).toFixed(1));
        tempValEl.textContent = netSicaklik.toFixed(1);

        const sicaklikOrani = Math.min(1, Math.max(0, (mevcutSicaklik - ortamSicakligi) / (ustLimit - ortamSicakligi)));
        sensor.style.boxShadow = sicaklikOrani > 0.08
            ? `0 0 ${Math.round(8 + sicaklikOrani * 28)}px rgba(255, ${Math.round(140 - sicaklikOrani * 110)}, 0, ${(0.25 + sicaklikOrani * 0.65).toFixed(2)})`
            : 'none';

        socket.emit('sicaklikData', { value: netSicaklik });
    }

    timer = setInterval(sicaklikOlc, gecikmeMs);
    ayarlariGetir();
    setInterval(ayarlariGetir, 3000);
</script>
</body>
</html>
