<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nem Sensörü Simülasyonu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: black;
            margin: 0;
            overflow: hidden;
        }
        .box {
            width: 100px;
            height: 100px;
            position: relative;
            top: 50%;
            transform: translateY(-50%);
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: box-shadow 0.25s ease;
        }
        .h-100 {
            height: 100vh !important;
        }
        .cursor-pointer {
            cursor: pointer;
        }
        .mist-aura {
            position: absolute;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(13, 202, 240, 0.3) 0%, rgba(13, 110, 253, 0.08) 55%, transparent 75%);
            pointer-events: none;
            animation: mistBreathe 3.2s ease-in-out infinite;
        }
        @keyframes mistBreathe {
            0%, 100% {
                transform: scale(0.94);
                opacity: 0.78;
            }
            50% {
                transform: scale(1.07);
                opacity: 1;
            }
        }
        .telemetry-panel {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(33, 37, 41, 0.9);
            border: 1px solid #495057;
            color: #0dcaf0;
            padding: 12px 16px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            z-index: 2000;
            min-width: 240px;
        }
    </style>
</head>
<body>

<div class="telemetry-panel">
    <div>SOCKET: <span id="ws-status" class="text-danger">BAGLI DEGIL</span></div>
    <div>GECIKME: <span id="delay-val" class="text-light">100</span> ms</div>
    <div>NEM: <span id="hum-val">35</span> %</div>
</div>

<div class="container-fluid w-100 p-0 h-100">
    <div class="row p-0 m-0 h-100">
        <div class="col-2 ms-0 ps-0">
            <div class="box bg-info text-dark fw-bold" id="sensor">
                <span>nem sensoru</span>
            </div>
        </div>
        <div class="col-10">
            <div class="box bg-primary draggable cursor-pointer text-white fw-bold">
                <div class="mist-aura"></div>
                <span>buhar kaynagi</span>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.socket.io/4.8.4/socket.io.min.js"></script>
<script>
    const draggable = document.querySelector('.draggable');
    const sensor = document.getElementById('sensor');
    const wsStatusEl = document.getElementById('ws-status');
    const delayValEl = document.getElementById('delay-val');
    const humValEl = document.getElementById('hum-val');

    const socket = io();
    let gecikmeMs = 100; // Default delay value in milliseconds
    let timer = null;

    async function ayarlariGetir() {
        try {
            const res = await fetch('/getSettingsData', { method: 'POST' });
            const data = await res.json();
            if (data && data.nem && data.nem.ms > 0) {
                const yeniMs = Number(data.nem.ms);
                if (yeniMs !== gecikmeMs) {
                    gecikmeMs = yeniMs;
                    delayValEl.textContent = gecikmeMs;
                    clearInterval(timer);
                    timer = setInterval(nemOlc, gecikmeMs);
                }
            }
        } catch (e) {}
    }

    socket.on('connect', () => {
        wsStatusEl.textContent = 'BAGLANDI';
        wsStatusEl.className = 'text-success';
    });

    socket.on('disconnect', () => {
        wsStatusEl.textContent = 'KOPTU';
        wsStatusEl.className = 'text-danger';
    });
    // drag foknsiyonları
    let isDragging = false;
    let offsetX = 0;
    let offsetY = 0;

    draggable.addEventListener('pointerdown', (e) => {
        isDragging = true;
        const rect = draggable.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;

        draggable.style.position = 'absolute';
        draggable.style.left = rect.left + 'px';
        draggable.style.top = rect.top + 'px';
        draggable.style.transform = 'none';
        draggable.style.zIndex = '1000';
        draggable.setPointerCapture(e.pointerId);
    });

    document.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const rect = draggable.getBoundingClientRect();
        const maxLeft = window.innerWidth - rect.width;
        const maxTop = window.innerHeight - rect.height;
        draggable.style.left = Math.min(Math.max(0, e.clientX - offsetX), maxLeft) + 'px';
        draggable.style.top = Math.min(Math.max(0, e.clientY - offsetY), maxTop) + 'px';
    });

    document.addEventListener('pointerup', () => isDragging = false);
    document.addEventListener('pointercancel', () => isDragging = false);

    const ortamNemi = 35.0; // ayarlanabilir ortam nemi
    let mevcutNem = ortamNemi;
    let sonZaman = performance.now();

    function nemOlc() {
        // burada da buhar kaynagi ile sensor arasındaki mesafeye göre nemi hesaplayacağız
        const simdi = performance.now();
        const dt = Math.min(1.0, Math.max(0.001, (simdi - sonZaman) / 1000));
        sonZaman = simdi;

        const sRect = sensor.getBoundingClientRect();
        const mRect = draggable.getBoundingClientRect();

        const dx = (mRect.left + mRect.width / 2) - (sRect.left + sRect.width / 2);
        const dy = (mRect.top + mRect.height / 2) - (sRect.top + sRect.height / 2);
        const mesafe = Math.hypot(dx, dy);

        const efektifMesafe = Math.max(0, mesafe - 50);
        const etki = 1 / (1 + Math.pow(efektifMesafe / 145, 2));
        const hedefNem = ortamNemi + (etki * (100.0 - ortamNemi));

        const tau = hedefNem > mevcutNem ? 1.1 : 2.6;
        const alpha = 1 - Math.exp(-dt / tau);
        mevcutNem += (hedefNem - mevcutNem) * alpha;

        const netNem = Math.min(100, Math.max(0, Math.round(mevcutNem + (Math.random() - 0.5))));
        humValEl.textContent = netNem;

        const nemOrani = Math.min(1, Math.max(0, (mevcutNem - ortamNemi) / (100 - ortamNemi)));
        sensor.style.boxShadow = nemOrani > 0.08
            ? `0 0 ${Math.round(8 + nemOrani * 26)}px rgba(13, 202, 240, ${(0.25 + nemOrani * 0.65).toFixed(2)})`
            : 'none';

        socket.emit('nemData', { value: netNem });
    }

    timer = setInterval(nemOlc, gecikmeMs);
    ayarlariGetir();
    setInterval(ayarlariGetir, 3000);
</script>
</body>
</html>
