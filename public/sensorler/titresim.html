<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titreşim Sensörü Simülasyonu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: black;
            margin: 0;
            overflow: hidden;
        }
        .box {
            width: 100px;
            height: 100px;
            position: relative;
            top: 50%;
            transform: translateY(-50%);
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .h-100 {
            height: 100vh !important;
        }
        .cursor-pointer {
            cursor: pointer;
        }
        .shock-ring {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid rgba(255, 193, 7, 0.85);
            pointer-events: none;
            animation: shockExpand 0.65s ease-out forwards;
        }
        @keyframes shockExpand {
            0% {
                transform: scale(0.8);
                opacity: 0.9;
            }
            100% {
                transform: scale(3.2);
                opacity: 0;
            }
        }
        .telemetry-panel {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(33, 37, 41, 0.9);
            border: 1px solid #495057;
            color: #20c997;
            padding: 12px 16px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            z-index: 2000;
            min-width: 240px;
        }
    </style>
</head>
<body>

<div class="telemetry-panel">
    <div>SOCKET: <span id="ws-status" class="text-danger">BAGLI DEGIL</span></div>
    <div>GECIKME: <span id="delay-val" class="text-light">100</span> ms</div>
    <div>DURUM: <span id="status-val" class="text-success">DURAGAN</span></div>
    <div>TITRESIM: <span id="vib-val">0</span></div>
</div>

<div class="container-fluid w-100 p-0 h-100">
    <div class="row p-0 m-0 h-100">
        <div class="col-2 ms-0 ps-0">
            <div class="box bg-success text-white fw-bold" id="sensor">
                <span>titresim sensoru</span>
            </div>
        </div>
        <div class="col-10">
            <div class="box bg-light draggable cursor-pointer text-dark fw-bold">
                <span>kutle</span>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.socket.io/4.8.4/socket.io.min.js"></script>
<script>
    const draggable = document.querySelector('.draggable');
    const sensor = document.getElementById('sensor');
    const wsStatusEl = document.getElementById('ws-status');
    const delayValEl = document.getElementById('delay-val');
    const statusValEl = document.getElementById('status-val');
    const vibValEl = document.getElementById('vib-val');

    const socket = io();
    let gecikmeMs = 100; // default gecikme süresi
    let ustLimit = 100;  // default üst limit
    let timer = null;

    async function ayarlariGetir() {
        // backendden titresim ayarlarını çek
        try {
            const res = await fetch('/getSettingsData', { method: 'POST' });
            const data = await res.json();
            if (data && data.titresim) {
                if (data.titresim.max > 0) ustLimit = Math.max(100, Number(data.titresim.max) * 1.5);
                const yeniMs = Number(data.titresim.ms);
                if (yeniMs > 0 && yeniMs !== gecikmeMs) {
                    gecikmeMs = yeniMs;
                    delayValEl.textContent = gecikmeMs;
                    clearInterval(timer);
                    timer = setInterval(titresimOlc, gecikmeMs);
                }
            }
        } catch (e) {}
    }

    socket.on('connect', () => {
        wsStatusEl.textContent = 'BAGLANDI';
        wsStatusEl.className = 'text-success';
    });

    socket.on('disconnect', () => {
        wsStatusEl.textContent = 'KOPTU';
        wsStatusEl.className = 'text-danger';
    });
    // drag & drop işlevleri
    let isDragging = false;
    let offsetX = 0;
    let offsetY = 0;
    let titresimEnerjisi = 0;
    let carpismaKilit = false;

    let oncekiMerkez = null;
    let sonZaman = performance.now();

    function sokDalgasiOlustur(gucOrani) {
        // basit bi halka olusturup sok efekti ver
        const halka = document.createElement('div');
        halka.className = 'shock-ring';
        halka.style.borderColor = gucOrani > 0.6
            ? 'rgba(220, 53, 69, 0.9)'
            : 'rgba(255, 193, 7, 0.85)';
        sensor.appendChild(halka);
        setTimeout(() => halka.remove(), 650);
    }

    draggable.addEventListener('pointerdown', (e) => {
        isDragging = true;
        const rect = draggable.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;

        draggable.style.position = 'absolute';
        draggable.style.left = rect.left + 'px';
        draggable.style.top = rect.top + 'px';
        draggable.style.transform = 'none';
        draggable.style.zIndex = '1000';
        draggable.setPointerCapture(e.pointerId);
    });

    document.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const rect = draggable.getBoundingClientRect();
        const maxLeft = window.innerWidth - rect.width;
        const maxTop = window.innerHeight - rect.height;
        draggable.style.left = Math.min(Math.max(0, e.clientX - offsetX), maxLeft) + 'px';
        draggable.style.top = Math.min(Math.max(0, e.clientY - offsetY), maxTop) + 'px';
    });

    document.addEventListener('pointerup', () => { isDragging = false; });
    document.addEventListener('pointercancel', () => { isDragging = false; });

    function titresimOlc() {
        /* 
        titreşim ölçme fonksiyonu;
        buradaki mantık, kutle sensöre çarptığında veya hızlı hareket ettiğinde titreşim enerjisi artıyor ve zamanla azalıyor.
        bu enerji sensörün titreşim değerini belirliyor.
        */
        const simdi = performance.now();
        const dt = Math.min(1.0, Math.max(0.001, (simdi - sonZaman) / 1000));
        sonZaman = simdi;

        const sRect = sensor.getBoundingClientRect();
        const kRect = draggable.getBoundingClientRect();

        const kMerkezX = kRect.left + kRect.width / 2;
        const kMerkezY = kRect.top + kRect.height / 2;
        const sMerkezX = sRect.left + sRect.width / 2;
        const sMerkezY = sRect.top + sRect.height / 2;

        let hizPxSn = 0; // çarpma hızını piksel/saniye cinsinden hesaplamak için
        if (oncekiMerkez) {
            const dx = kMerkezX - oncekiMerkez.x;
            const dy = kMerkezY - oncekiMerkez.y;
            hizPxSn = Math.hypot(dx, dy) / dt;
        }
        oncekiMerkez = { x: kMerkezX, y: kMerkezY };

        const carpti = !(kRect.right < sRect.left || kRect.left > sRect.right || kRect.bottom < sRect.top || kRect.top > sRect.bottom);
        const mesafe = Math.hypot(kMerkezX - sMerkezX, kMerkezY - sMerkezY);

        if (carpti && !carpismaKilit) {
            const darbeEnerjisi = Math.min(ustLimit, Math.max(ustLimit * 0.12, hizPxSn * 0.08)); // basit bir darbe enerjisi hesaplama hız arttıkça enerji artıyor
            titresimEnerjisi = Math.min(ustLimit, Math.max(titresimEnerjisi, darbeEnerjisi));
            carpismaKilit = true;
            sokDalgasiOlustur(darbeEnerjisi / ustLimit);
        } else if (!carpti) {
            carpismaKilit = false;
        }

        if (isDragging && hizPxSn > 80) {
            if (carpti) {
                titresimEnerjisi = Math.min(ustLimit, titresimEnerjisi + (hizPxSn * 0.03 * dt * 10)); // çarpışma sırasında hız arttıkça titreşim enerjisi artıyor
            } else {
                const zeminZayiflama = 1 / (1 + Math.pow(Math.max(0, mesafe - 80) / 160, 2));
                if (zeminZayiflama > 0.15 && hizPxSn > 500) {
                    titresimEnerjisi = Math.min(ustLimit, titresimEnerjisi + (hizPxSn * 0.015 * zeminZayiflama * dt * 10));
                }
            }
        }

        titresimEnerjisi *= Math.exp(-dt / 0.65);
        if (titresimEnerjisi < 0.5) titresimEnerjisi = 0;

        const netTitresim = Math.round(titresimEnerjisi);
        const oran = Math.min(1, netTitresim / ustLimit);

        if (netTitresim > 3) {
            const genlik = 2 + oran * 12;
            const sarsX = (Math.random() - 0.5) * genlik;
            const sarsY = (Math.random() - 0.5) * genlik;
            sensor.style.transform = `translate(${sarsX}px, calc(-50% + ${sarsY}px))`;
            sensor.style.boxShadow = `0 0 ${Math.round(10 + oran * 24)}px rgba(255, ${Math.round(193 - oran * 140)}, 7, ${(0.35 + oran * 0.6).toFixed(2)})`;
            statusValEl.textContent = 'SARSINTI VAR';
            statusValEl.className = 'text-warning';
        } else {
            sensor.style.transform = 'translateY(-50%)';
            sensor.style.boxShadow = 'none';
            statusValEl.textContent = 'DURAGAN';
            statusValEl.className = 'text-success';
        }

        vibValEl.textContent = netTitresim;
        socket.emit('titresimData', { value: netTitresim });
    }

    timer = setInterval(titresimOlc, gecikmeMs);
    ayarlariGetir();
    setInterval(ayarlariGetir, 3000);
</script>
</body>
</html>
