<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultrasonik Sensör Simülasyonu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: black;
            margin: 0;
            overflow: hidden;
        }
        .box {
            width: 100px;
            height: 100px;
            vertical-align: middle;
            position: relative;
            top: 50%;
            transform: translateY(-50%);
            user-select: none;
            transition: box-shadow 0.2s ease;
        }
        .h-100 {
            height: 100vh !important;
        }
        .cursor-pointer {
            cursor: pointer;
        }
        .rotate-90 {
            display: inline-block;
            top: 50%;
            position: relative;
            transform: translateY(-50%) rotate(-90deg);
            text-align: center;
        }
        .sensor-cone {
            position: absolute;
            left: 100%;
            top: 50%;
            transform: translateY(-50%);
            height: 0;
            border-top: 150px solid transparent;
            border-bottom: 150px solid transparent;
            border-right: 800px solid rgba(13, 110, 253, 0.12);
            pointer-events: none;
            z-index: 1;
            width: 100% !important;
            transition: border-right-color 0.2s ease;
        }
        .sensor-cone.detected {
            border-right-color: rgba(25, 135, 84, 0.22);
        }
        .sensor-cone.blind {
            border-right-color: rgba(255, 193, 7, 0.22);
        }
        .sonar-wave {
            position: absolute;
            left: 100%;
            top: 50%;
            width: 18px;
            height: 64px;
            border: 2px solid rgba(13, 202, 240, 0.55);
            border-left: none;
            border-radius: 0 50% 50% 0;
            transform: translateY(-50%);
            pointer-events: none;
            z-index: 2;
            animation: sonarPulse 1.6s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
        }
        .sonar-wave.delay-1 {
            animation-delay: 0.53s;
        }
        .sonar-wave.delay-2 {
            animation-delay: 1.06s;
        }
        @keyframes sonarPulse {
            0% {
                opacity: 0.75;
                transform: translateY(-50%) translateX(0) scaleY(0.7);
            }
            100% {
                opacity: 0;
                transform: translateY(-50%) translateX(360px) scaleY(3.2);
            }
        }
        .telemetry-panel {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(33, 37, 41, 0.9);
            border: 1px solid #495057;
            color: #0dcaf0;
            padding: 12px 16px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            z-index: 2000;
            min-width: 240px;
        }
    </style>
</head>
<body>

<div class="telemetry-panel">
    <div>SOCKET: <span id="ws-status" class="text-danger">BAGLI DEGIL</span></div>
    <div>GECIKME: <span id="delay-val" class="text-light">100</span> ms</div>
    <div>DURUM: <span id="target-status" class="text-warning">HEDEF YOK</span></div>
    <div>MESAFE: <span id="dist-val">---</span> mm</div>
    <div>YANKI: <span id="echo-val">---</span> µs</div>
</div>

<div class="container-fluid w-100 p-0 h-100">
    <div class="row p-0 m-0 h-100">
        <div class="col-2 ms-0 ps-0">
            <div class="box bg-primary" id="sensor">
                <span class="tex-sm text-white rotate-90">ultrasonik sensor</span>
                <div class="sensor-cone" id="sensor-cone"></div>
                <div class="sonar-wave"></div>
                <div class="sonar-wave delay-1"></div>
                <div class="sonar-wave delay-2"></div>
            </div>
        </div>
        <div class="col-10">
            <div class="box bg-success draggable cursor-pointer">
                <span class="text-sm text-white">kutu</span>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.socket.io/4.8.4/socket.io.min.js"></script>
<script>
    const draggable = document.querySelector('.draggable');
    const sensor = document.getElementById('sensor');
    const sensorCone = document.getElementById('sensor-cone');
    const wsStatusEl = document.getElementById('ws-status');
    const delayValEl = document.getElementById('delay-val');
    const targetStatusEl = document.getElementById('target-status');
    const distValEl = document.getElementById('dist-val');
    const echoValEl = document.getElementById('echo-val');

    const socket = io();
    let gecikmeMs = 100; //default gecikme süresi
    let timer = null;

    async function ayarlariGetir() {
        // backendden ultrasonik ayarlarını çek
        try {
            const res = await fetch('/getSettingsData', { method: 'POST' });
            const data = await res.json();
            if (data && data.ultrasonik && data.ultrasonik.ms > 0) {
                const yeniMs = Number(data.ultrasonik.ms);
                if (yeniMs !== gecikmeMs) {
                    gecikmeMs = yeniMs;
                    delayValEl.textContent = gecikmeMs;
                    clearInterval(timer);
                    timer = setInterval(mesafeOlc, gecikmeMs);
                }
            }
        } catch (e) {}
    }

    socket.on('connect', () => {
        wsStatusEl.textContent = 'BAGLANDI';
        wsStatusEl.className = 'text-success';
    });

    socket.on('disconnect', () => {
        wsStatusEl.textContent = 'KOPTU';
        wsStatusEl.className = 'text-danger';
    });
    // Drag & Drop işlevleri
    let isDragging = false;
    let offsetX = 0;
    let offsetY = 0;

    draggable.addEventListener('pointerdown', (e) => {
        isDragging = true;
        const rect = draggable.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;

        draggable.style.position = 'absolute';
        draggable.style.left = rect.left + 'px';
        draggable.style.top = rect.top + 'px';
        draggable.style.transform = 'none';
        draggable.style.zIndex = '1000';
        draggable.setPointerCapture(e.pointerId);
    });

    document.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const rect = draggable.getBoundingClientRect();
        const maxLeft = window.innerWidth - rect.width;
        const maxTop = window.innerHeight - rect.height;
        const nextLeft = Math.min(Math.max(0, e.clientX - offsetX), maxLeft);
        const nextTop = Math.min(Math.max(0, e.clientY - offsetY), maxTop);
        draggable.style.left = nextLeft + 'px';
        draggable.style.top = nextTop + 'px';
    });

    document.addEventListener('pointerup', () => isDragging = false);
    document.addEventListener('pointercancel', () => isDragging = false);




    // Ultrasonik sensörün mesafeyi ölçme fonksiyonu
    /* 
        burada pixel değerlerini milimetreye çevirmek için 1px = 2mm olarak kabul ediyoruz, bunu ekrana göre değişebiliriz ama üşendim.
    */
    function mesafeOlc() {
        const sRect = sensor.getBoundingClientRect();
        const eRect = draggable.getBoundingClientRect();

        const mesafePx = eRect.left - sRect.right;
        const mesafeMm = mesafePx / 2;

        const merkezY = sRect.top + (sRect.height / 2);
        const efektifPx = Math.max(0, mesafePx);
        const baslangicYaricap = sRect.height * 0.15;
        const koniYaricap = baslangicYaricap + efektifPx * Math.tan(10.62 * Math.PI / 180);

        const sensorOnunde = eRect.right > sRect.right;
        const acida = eRect.bottom >= (merkezY - koniYaricap) && eRect.top <= (merkezY + koniYaricap);
        const dikeyHizada = eRect.bottom >= sRect.top && eRect.top <= sRect.bottom;
        const menzilde = mesafeMm >= 20 && mesafeMm <= 400; // 20mm ile 400mm arası menzil
        const korBolgede = sensorOnunde && mesafeMm < 20 && dikeyHizada;

        if (menzilde && acida) {
            const gurultu = (Math.random() - 0.5) * 1.6;
            const netMesafe = Number(Math.max(20, mesafeMm + gurultu).toFixed(2));
            const echoSure = Math.round((netMesafe * 2) / 0.343);

            targetStatusEl.textContent = 'ALGILANDI';
            targetStatusEl.className = 'text-success';
            distValEl.textContent = netMesafe;
            echoValEl.textContent = echoSure;
            sensorCone.className = 'sensor-cone detected';
            sensor.style.boxShadow = '0 0 22px rgba(25, 135, 84, 0.7)';

            socket.emit('ultrasonikData', {
                detected: true,
                distanceMm: netMesafe,
                echoUs: echoSure
            });
        } else if (korBolgede) {
            // kör bölgedeyse
            targetStatusEl.textContent = 'KOR BOLGE (<20mm)';
            targetStatusEl.className = 'text-warning';
            distValEl.textContent = '---';
            echoValEl.textContent = '---';
            sensorCone.className = 'sensor-cone blind';
            sensor.style.boxShadow = '0 0 20px rgba(255, 193, 7, 0.65)';

            socket.emit('ultrasonikData', {
                detected: false,
                distanceMm: null,
                echoUs: null
            });
        } else {
            // menzil dışındaysa
            targetStatusEl.textContent = 'MENZIL DISI';
            targetStatusEl.className = 'text-warning';
            distValEl.textContent = '---';
            echoValEl.textContent = '---';
            sensorCone.className = 'sensor-cone';
            sensor.style.boxShadow = 'none';

            socket.emit('ultrasonikData', {
                detected: false,
                distanceMm: null,
                echoUs: null
            });
        }
    }

    timer = setInterval(mesafeOlc, gecikmeMs);
    ayarlariGetir();
    setInterval(ayarlariGetir, 3000);
</script>
</body>
</html>
